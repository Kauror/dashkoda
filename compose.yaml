services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      # Build identity for the sidebar stamp. Both are optional; unset simply
      # means the image carries no version. Supply them on the build command:
      #   BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
      #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build web
      args:
        BUILD_TIME: ${BUILD_TIME:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      VIEWER_PIN_HASH: ${VIEWER_PIN_HASH:?VIEWER_PIN_HASH is required}
      VIEWER_PIN_VERSION: ${VIEWER_PIN_VERSION:?VIEWER_PIN_VERSION is required}
      VIEWER_RATE_LIMIT_SECRET: ${VIEWER_RATE_LIMIT_SECRET:?VIEWER_RATE_LIMIT_SECRET is required}
      TRUST_CLOUDFLARE_IP_HEADER: ${TRUST_CLOUDFLARE_IP_HEADER:-false}
      # Private originals. The path is inside the container and the named
      # volume below keeps it out of the image and off any served path.
      SOURCE_ARTIFACT_ROOT: /srv/dashkoda/source-artifacts
      # View-only OneDrive sharing link for the legal-work workbook. Optional:
      # blank is a valid configuration and the application starts without it.
      # Only `sync_oigusloome_public` requires it. The real value belongs in the
      # server's own environment file and is never committed.
      OIGUSLOOME_PUBLIC_URL: ${OIGUSLOOME_PUBLIC_URL:-}
      # View-only OneDrive sharing link for the event-programme workbook. Same
      # rules: optional, blank is valid, the application starts without it, and
      # only `sync_event_programme` requires it. It has to be named here as well
      # as in the environment file — Compose reads `.env` for interpolation, so a
      # variable that is never referenced under `environment:` does not reach the
      # container and the command fails with "missing" however correct the file is.
      EVENT_PROGRAMME_PUBLIC_URL: ${EVENT_PROGRAMME_PUBLIC_URL:-}
      # Google Analytics website traffic. Both optional and blank by default, on
      # the same terms as the two sharing links above: the application starts
      # without them, every page renders without them, and only `sync_ga4` needs
      # them. Named here as well as in the environment file for the reason
      # spelled out immediately above.
      #
      # `GA4_PROPERTY_ID` is the numeric property, which is not a secret.
      # `GA4_CREDENTIALS_FILE` is a path *inside the container*; the key it
      # points at is mounted read-only by the deployment and is never in the
      # image, in Git, or in any log.
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GA4_CREDENTIALS_FILE: ${GA4_CREDENTIALS_FILE:-}
    volumes:
      - source_artifacts:/srv/dashkoda/source-artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health/ready/", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  db:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  source_artifacts:
