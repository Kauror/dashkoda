[project]
name = "dashkoda"
version = "0.1.0"
description = "Internal management dashboard for the Estonian Chamber of Commerce and Industry."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.16",
    "google-auth==2.45.0",
    "gunicorn==26.0.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.4",
    "pypdf==6.15.0",
    "requests==2.34.2",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
django_find_project = false
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
# Exactly one warning is filtered, by message, and nothing else.
#
# WhiteNoise warns once per test that renders a page when `staticfiles/` has not
# been collected — which on a host test run it has not, and need not be. That
# was 388 of the suite's 388 warnings, and a warning that appears 388 times for
# a known benign reason is not a signal, it is a screen that hides the ones that
# matter. The container job, where the directory exists, reported 1.
#
# Deliberately not `ignore::UserWarning`: the category is far too broad, and
# hiding it wholesale is how a real warning goes unnoticed. Anything WhiteNoise
# does not say still reaches the summary.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Django writes migrations itself and packs long `choices` lists onto one line.
# Reformatting generated files by hand would only invite drift, so the line
# limit is relaxed there and nowhere else.
"**/migrations/*.py" = ["E501"]
