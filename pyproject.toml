[project]
name = "dashkoda"
version = "0.1.0"
description = "Internal management dashboard for the Estonian Chamber of Commerce and Industry."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.16",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
django_find_project = false
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
