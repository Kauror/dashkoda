name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request makes an in-flight run obsolete, so it
# is cancelled rather than left to finish against superseded code.
#
# Pushes to main are never cancelled: every commit on the default branch keeps
# its own verified result, which is what lets a deployment name the exact SHA
# whose CI passed. That was the intent before, but the group was keyed on
# `github.ref` — one group for every push to main — so merging three pull
# requests in quick succession cancelled the first two runs and left two commits
# on main with no result of their own. Keying main's group on the commit gives
# each one its own group, so nothing can supersede it.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
        && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared by all three jobs. Every value is synthetic and exists only for CI;
# no real secret, PIN or sharing URL is present in this repository.
env:
  COMPOSE_PROJECT_NAME: dashkoda_ci
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-only-secret-with-sufficient-length-not-for-production
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,dash.orgusaar.ee
  POSTGRES_DB: dashkoda
  POSTGRES_USER: dashkoda
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432
  VIEWER_PIN_HASH: 'pbkdf2_sha256$1000000$ISWGm2iaWYDO60zg6cKsch$aa1cqy5nqDB6mUqSjp+IdmKSbF0ANciYXAprUkgNVbQ='
  VIEWER_PIN_VERSION: 1
  VIEWER_RATE_LIMIT_SECRET: ci-only-synthetic-rate-limit-secret
  TRUST_CLOUDFLARE_IP_HEADER: "false"
  # Synthetic private-artifact root for the host-side checks. A literal
  # path, because the `runner` context is not available in job-level env.
  # The test suite repoints this per test; Compose sets its own
  # in-container path and mounts a named volume there.
  SOURCE_ARTIFACT_ROOT: /tmp/dashkoda-ci-source-artifacts
  # Synthetic PIN used only by the browser smoke suite. The real viewer PIN
  # is never present in this repository or in any workflow.
  DASHKODA_E2E_PIN: "4071"

# The three jobs are independent and run in parallel. None consumes an artifact
# another produces: the container jobs build their own images from the
# Dockerfile, which builds the frontend in its own stage, so nothing waits on
# the host build. GitHub reports each failure separately.
jobs:
  # Clean-host dependency installation, the static quality gates, clean
  # PostgreSQL migrations and the full host test suite.
  quality-and-host-tests:
    name: Quality and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: dashkoda
          POSTGRES_USER: dashkoda
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashkoda -d dashkoda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.29
          python-version: 3.14.6
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install locked frontend dependencies
        run: npm ci

      # F-CI-2: dependency scanning is ADVISORY by decision. A vulnerability
      # disclosed at an awkward moment must not stand between a fix and
      # production, so neither audit fails the job. Both run visibly, print
      # what they found, and say plainly that they did not gate anything.
      #
      # `continue-on-error` is deliberately not used: it marks the step as
      # failed-but-tolerated, which reads as a red mark nobody investigates.
      # `|| true` on the audit command keeps the step green while still
      # printing the findings, and a separate line states the status.
      - name: Audit frontend dependencies (advisory)
        run: |
          echo "::group::npm audit — advisory, does not gate this build"
          npm audit --audit-level=high || true
          echo "::endgroup::"
          echo "npm audit is advisory: high and critical findings are printed above."

      - name: Audit Python dependencies (advisory)
        run: |
          echo "::group::pip-audit — advisory, does not gate this build"
          # Run through `uvx` so the scanner is never added to the application's
          # own locked dependencies: it is CI tooling, not something the runtime
          # image should carry. Pinned so a scanner release cannot change what
          # this job does without a commit.
          uv export --frozen --no-dev --no-emit-project > /tmp/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/requirements.txt --progress-spinner off || true
          echo "::endgroup::"
          echo "pip-audit is advisory: findings are printed above and gate nothing."

      - name: Build frontend bundle
        run: npm run build

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Apply migrations to clean PostgreSQL
        run: uv run python manage.py migrate --noinput

      - name: Test
        run: uv run pytest

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check

      - name: Run Django system check
        run: uv run python manage.py check

      - name: Run production deployment check
        run: uv run python manage.py check --deploy --settings=config.settings.production

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput

  # Production-shape verification: the images, what the runtime image contains,
  # Compose networking, migrations against the composed database, health and
  # route smoke tests, the startup-log gate and volume persistence.
  #
  # The full pytest suite deliberately does NOT run here. It used to, and it
  # doubled the pipeline's cost — the same tests, the same settings module and
  # the same digest-pinned PostgreSQL image already run in `quality-and-host-tests`,
  # so the second run could only catch a defect in the dev image's Python
  # environment itself. That seam is covered more directly by everything this
  # job still does — migrate and collectstatic inside the container, the HTTP
  # smoke against the running service, the startup-log gate — and by the
  # browser job, which drives every page through this same runtime. The trade
  # is explicit: an image-only breakage that none of those touch goes unseen
  # here in exchange for ~15 minutes on every push.
  container-integration:
    name: Container integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.dev.yaml config

      - name: Build production image
        run: docker compose -f compose.yaml build

      - name: Build development runtime
        run: docker compose -f compose.yaml -f compose.dev.yaml build

      - name: Verify the runtime image carries no Node toolchain
        run: |
          docker compose -f compose.yaml run --rm --no-deps --entrypoint sh web -c '
            for binary in node npm npx; do
              if command -v "$binary" >/dev/null 2>&1; then
                echo "$binary must not exist in the runtime image"
                exit 1
              fi
            done
            if [ -d /app/node_modules ]; then
              echo "node_modules must not exist in the runtime image"
              exit 1
            fi
            test -f /app/staticfiles/build/styles.css
            test -f /app/staticfiles/build/app.js
            # The private artifact root must exist, be writable by the runtime
            # user, and sit outside every served static path.
            test -d /srv/dashkoda/source-artifacts
            test -w /srv/dashkoda/source-artifacts
            if [ -e /app/staticfiles/sources ] || [ -e /app/static/sources ]; then
              echo "source artifacts must never be inside a static path"
              exit 1
            fi
          '

      - name: Run Compose integration smoke
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up -d --wait
          docker compose -f compose.yaml -f compose.dev.yaml exec -T web python manage.py migrate
          docker compose -f compose.yaml -f compose.dev.yaml exec -T web python manage.py collectstatic --noinput
          docker compose -f compose.yaml -f compose.dev.yaml ps
          curl --fail --show-error --retry 5 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/health/live/
          curl --fail --show-error --retry 5 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/health/ready/
          docker compose -f compose.yaml -f compose.dev.yaml exec -T web python - <<'PY'
          import http.client

          def request(method, path):
              connection = http.client.HTTPConnection("127.0.0.1", 8000)
              connection.request(
                  method,
                  path,
                  headers={"Host": "localhost", "X-Forwarded-Proto": "https"},
              )
              response = connection.getresponse()
              result = response.status, response.getheader("Location")
              response.read()
              connection.close()
              return result

          def expect(method, path, status, location_prefix=None):
              actual_status, actual_location = request(method, path)
              assert actual_status == status, (
                  f"{method} {path}: expected {status}, got {actual_status} "
                  f"with Location {actual_location!r}"
              )
              if location_prefix:
                  assert actual_location and actual_location.startswith(location_prefix), (
                      f"{method} {path}: unexpected Location {actual_location!r}"
                  )

          expect("GET", "/", 302, "/sisene/")
          expect("GET", "/sisene/", 200)
          expect("GET", "/admin/", 302, "/sisene/")
          expect("GET", "/robots.txt", 200)
          expect("GET", "/dashboard/varskus/", 302, "/sisene/")
          logout_status, _logout_location = request("POST", "/logi-valja/")
          assert logout_status >= 300, f"POST logout unexpectedly returned {logout_status}"
          PY
          # The runtime must start clean. Gunicorn logs `[ERROR]` only for real
          # faults, so anything at that level here is a regression — a missing
          # writable path, a failed subsystem — and is worth failing the build
          # for even when the application still answers requests.
          if docker compose -f compose.yaml -f compose.dev.yaml logs web | grep -F "[ERROR]"; then
            echo "the web container logged an error during startup"
            exit 1
          fi
          # PostgreSQL must stay on the private backend network. Resolve the
          # service to a real container and read the authoritative binding
          # state from `docker inspect`; anything that cannot be established —
          # an unresolved service, a failing inspect, an unparsable document —
          # fails the build rather than passing quietly. `ops/check_db_port.py`
          # carries the logic and `tests/core/test_db_port_guard.py` covers
          # both polarities.
          db_container="$(docker compose -f compose.yaml -f compose.dev.yaml ps --quiet db)"
          python3 ops/check_db_port.py --container "${db_container}" --port 5432/tcp
          volume_name="$(docker volume ls \
            --filter label=com.docker.compose.project=dashkoda_ci \
            --filter label=com.docker.compose.volume=postgres_data \
            --quiet)"
          test -n "${volume_name}"
          docker compose -f compose.yaml -f compose.dev.yaml down
          docker volume inspect "${volume_name}"

      - name: Clean up Compose runtime
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down --volumes --remove-orphans

  # Browser acceptance against the Compose development runtime, at every
  # configured viewport.
  #
  # Sharded two ways because this job is the pipeline's critical path: the six
  # integrated dashboards put the two suites at ~13 minutes of browser time on
  # top of ~5 minutes of stack setup. Each shard is a complete, independent
  # world — its own runner, its own Compose stack, its own database, its own
  # seed — running half of Playwright's file × viewport matrix, so the
  # empty-then-seeded stage separation is exactly what it was on one runner.
  # `fail-fast: false` because one shard's failure cancelling the other would
  # hide half the verdict, and a cancelled job reads as nothing rather than
  # as a result.
  browser-e2e:
    name: Browser end-to-end (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # 40, not 25: the six integrated dashboards grew the seeded suite past the
    # old cap, and a job the cap always cancels reports nothing at all — every
    # browser verdict on dashboard-next was "cancelled at 25m22s" rather than
    # pass or fail. Generous for a half-suite shard on purpose: the cap exists
    # to catch a genuine hang, not to race the suite.
    timeout-minutes: 40
    env:
      # The browser drives the app over plain HTTP on loopback, so this run
      # uses the development settings module. The production-settings smoke
      # test in `container-integration` is unchanged and still covers that
      # configuration.
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Hash of DASHKODA_E2E_PIN. Synthetic, CI only.
      VIEWER_PIN_HASH: 'pbkdf2_sha256$1000000$jYAv7kifpcaiJWnHfcU12G$JoqiC9PRhkZ7tqjTvFdSH5cVbTvCTZMWMhUkg63QYIs='

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build development runtime
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.dev.yaml build

      - name: Start the Compose development runtime
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up -d --wait
          docker compose -f compose.yaml -f compose.dev.yaml exec -T web python manage.py migrate
          docker compose -f compose.yaml -f compose.dev.yaml exec -T web python manage.py collectstatic --noinput

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Empty database first: this stage's whole point is that the dashboard
      # invents nothing when no source is connected, and it asserts that no
      # digit reaches the shell.
      - name: Run browser smoke suite against an empty database
        run: npm run e2e -- --shard=${{ matrix.shard }}/2

      - name: Publish synthetic content
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml exec -T web \
            python manage.py seed_e2e_data

      # Same database, now populated. Separate stage rather than separate
      # assertions, because each stage's expectations are the other's failure.
      - name: Run browser suite against seeded content
        env:
          DASHKODA_E2E_SEEDED: "1"
        run: npm run e2e -- --shard=${{ matrix.shard }}/2

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            screenshots/
            playwright-report/
            playwright-report-seeded/
            test-results/
            test-results-seeded/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up Compose runtime
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down --volumes --remove-orphans
